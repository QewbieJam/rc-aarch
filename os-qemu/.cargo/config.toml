[build]
target = "aarch64-unknown-none"
# 仓库现在放在本地盘，编译产物用默认的 <repo>/target（已被 .gitignore 排除）
# （原先那行 target-dir 指向 ~/.cache 是为了绕开 CIFS 网络盘，已不需要）

[target.aarch64-unknown-none]
rustflags = [
    # 指定链接脚本（cargo 的 cwd 是包根目录，所以用相对路径）
    "-Clink-arg=-Tlinker.ld",
    # 保留帧指针：方便 gdb 回溯（也对应 rCore 的 -Cforce-frame-pointers=yes）
    "-Cforce-frame-pointers=yes",
]
